    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF6F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1410" />
    <script>
      /* تطبيق الثيم المحفوظ قبل أول رسم لمنع وميض الثيم الخاطئ */
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.setAttribute('data-theme', t);
            var c = t === 'dark' ? '#1A1410' : '#FAF6F0';
            var ms = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < ms.length; i++) {
              ms[i].removeAttribute('media');
              ms[i].setAttribute('content', c);
            }
          }
        } catch (e) {}
      })();
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
